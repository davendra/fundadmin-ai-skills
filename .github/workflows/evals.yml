# Distribution-side CI gate (not generated by tools/build_plugin.py).
# validate.yml remains the generated plugin/marketplace + unittest workflow.
# Structural eval fixture checks also ride on `unittest discover -s tests` there
# via tests/test_plugin_evals.py. This workflow makes the eval gate visible and
# documents what is intentionally deferred.
name: Eval fixtures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural eval fixtures (no host / no model)
        run: python3 -m unittest tests.test_plugin_evals -v
      # Deferred (not run here — flaky/expensive; needs pinned Claude Code host,
      # explicit model, private traces, and candidate-bound RELEASE_EVIDENCE):
      #   claude plugin eval --keep-temp --no-publish  (every saved case)
      #   python3 tools/verify_release_evidence.py --input /absolute/private/evidence.json
      # Those live in davendra/fundadmin-ai + operator-held evidence, not this
      # public distribution repo. See docs/production/README.md gates 3 and 6.
      # This job does not claim production certification.
