# Generated by tools/build_plugin.py in davendra/fundadmin-ai — do not edit here.
name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: the validator is the CLI's own schema, so a floating version
      # would turn an upstream change into a red run with no commit here.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.278
      - name: Validate plugin manifest, skills and agents
        run: claude plugin validate --strict plugins/fundadmin
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Build the manual
        run: cd manual && npm ci --no-audit --no-fund && npm run docs:build
      - name: Structural contracts
        run: python3 -m unittest discover -s tests -v
      - name: PDF script smoke test
        run: |
          pip install reportlab
          python3 plugins/fundadmin/skills/fund/scripts/generate_fund_pdf.py --help > /dev/null
